<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk map</title>

  <!-- Leaflet 1.9.4 and Leaflet.markercluster 1.5.3, self-hosted in leaflet_dist/ -->
  <link rel="stylesheet" href="leaflet_dist/leaflet.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.css">
  <link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="leaflet_dist/screen.css">
  <script src="leaflet_dist/leaflet.js"></script>
  <script src="leaflet_dist/leaflet.markercluster.js"></script>
  <script src="org-locations.js"></script>
</head>
<body>
  <div id="map"></div>
  <p class="hint">Click a cluster to zoom in; click a marker to see the location.</p>
  <script>
    var tiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 18,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
    });
    var map = L.map('map', { layers: [tiles], worldCopyJump: true });
    var markers = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 80 });

    for (var i = 0; i < addressPoints.length; i++) {
      var a = addressPoints[i];
      markers.addLayer(L.marker([a[1], a[2]], { title: a[0] }).bindPopup(a[0]));
    }
    map.addLayer(markers);

    if (addressPoints.length) {
      map.fitBounds(markers.getBounds(), { padding: [30, 30], maxZoom: 6 });
    } else {
      map.setView([30, 10], 1);
    }
  </script>
</body>
</html>
